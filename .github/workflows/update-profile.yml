name: Update GitHub Profile

on:
  workflow_dispatch:

  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-profile:

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------
      # Checkout repository
      # ---------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ---------------------------------------------
      # Setup Python
      # ---------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ---------------------------------------------
      # Install dependencies
      # ---------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv Pillow


      # ---------------------------------------------
      # Fetch GitHub profile data
      # ---------------------------------------------

      - name: Fetch GitHub profile data
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
        run: |
          python scripts/get_github_data.py


      # ---------------------------------------------
      # Fetch contribution data
      # ---------------------------------------------

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
        run: |
          python scripts/get_contributions.py


      # ---------------------------------------------
      # Generate heatmap
      # ---------------------------------------------

      - name: Generate contribution heatmap
        run: |
          python scripts/create_heatmap.py


      # ---------------------------------------------
      # Generate static dashboard
      # ---------------------------------------------

      - name: Generate static dashboard
        run: |
          python scripts/create_dashboard.py


      # ---------------------------------------------
      # Generate animated dashboard
      # ---------------------------------------------

      - name: Generate animated dashboard
        run: |
          python scripts/create_dashboard_gif.py


      # ---------------------------------------------
      # Check generated files
      # ---------------------------------------------

      - name: Check generated files
        run: |
          echo "Generated files:"
          ls -lh assets/
          echo ""
          echo "Git status:"
          git status


      # ---------------------------------------------
      # Commit changes
      # ---------------------------------------------

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add assets/
          git add data/

          git diff --cached --quiet || git commit -m "Update GitHub profile dashboard"


      # ---------------------------------------------
      # Push changes
      # ---------------------------------------------

      - name: Push changes
        run: |
          git push